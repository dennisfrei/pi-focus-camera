[project]
name = "pi-focus-camera"
version = "0.1.0"
description = "Prime-focus telescope camera backend (Litestar + picamera2)"
readme = "../README.md"
# Dev pins 3.14 via .python-version, but the floor is 3.13 so the Pi's apt python3-picamera2
# (system Python 3.13, deploy "Path B" in CONCEPT.md §7) can run the app too.
requires-python = ">=3.13"
dependencies = [
    "litestar[standard]>=2.12",
    "uvicorn[standard]>=0.30",
    "anyio>=4.4",
    "numpy>=2.0",
    "pillow>=10.4",
    "pydantic-settings>=2.4",
    "aiosqlite>=0.20",
]

# NOTE: the Raspberry Pi camera stack (picamera2 + rpi-libcamera + rpi-kms) is intentionally
# NOT declared here. Those packages only build on-device and would break `uv sync` on a dev box.
# Install them on the Pi from `requirements-pi.txt` (Path A) or via apt (Path B) — see CONCEPT.md §7.

[dependency-groups]
dev = [
    "ruff>=0.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "poethepoet>=0.29",
]

[tool.poe.tasks]
dev = "litestar --app app.main:app run --reload --host 0.0.0.0 --port 8080"
serve = "litestar --app app.main:app run --host 0.0.0.0 --port 8080"
test = "pytest"
lint = "ruff check ."
format = "ruff format ."

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
# Lint to the DEPLOYMENT floor, not the dev version: device Path B runs system Python 3.13,
# so 3.14-only constructs must be flagged here rather than failing at deploy.
target-version = "py313"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
