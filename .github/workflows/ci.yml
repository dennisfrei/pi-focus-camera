name: CI

on:
  push:
    branches: [master, main, "feat/**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      # Test on the DEPLOYMENT floor (Python 3.11 = Raspberry Pi OS Bookworm's system Python, deploy
      # Path B) rather than the dev 3.14, so a newer-only construct fails here not on the Pi (§9.7).
      - run: uv sync --python 3.11
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run check
      - run: npm run build
